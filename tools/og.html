<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0b0b; color: #f2f0ea; }
body { position: relative; font-family: Archivo, sans-serif; }
.glow { position: absolute; right: -120px; top: -160px; width: 760px; height: 760px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,59,92,.28), rgba(255,59,92,0) 65%); }
.brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 16px;
  font: 600 22px JetBrains Mono, monospace; letter-spacing: .1em; text-transform: uppercase; }
.brand img { width: 52px; height: 52px; border-radius: 13px; }
h1 { position: absolute; left: 68px; top: 150px; margin: 0; font-weight: 800; font-stretch: 62%; font-variation-settings: "wdth" 62;
  text-transform: uppercase; font-size: 126px; line-height: .86; letter-spacing: -.01em; }
h1 em { font-style: normal; color: #ff3b5c; }
.sub { position: absolute; left: 72px; bottom: 62px; font: 400 22px JetBrains Mono, monospace; color: #a9a59c; letter-spacing: .02em; }
.sub b { color: #f2f0ea; font-weight: 600; }
.panel { position: absolute; right: 70px; top: 54px; width: 330px; border-radius: 16px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.12); transform: rotate(2.5deg); }
.panel img { width: 100%; display: block; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="brand"><img src="../docs/assets/icon.svg" alt="">B-Side</div>
  <h1>Music videos<br>behind your<br><em>windows.</em></h1>
  <div class="panel"><img src="../docs/assets/panel.png" alt=""></div>
  <div class="sub"><b>Free Mac app</b> · YouTube as your wallpaper, with sound</div>
</body></html>
